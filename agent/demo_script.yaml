eager: false
intro: "This shipping support agent runs on Amazon Bedrock. Strands Decider decides which model tier handles each question and guards every irreversible action before it runs."
intro_normal: "This shipping support agent runs on Amazon Bedrock AgentCore Runtime. Strands Decider routes each message to the right model and guards irreversible actions."
turns:
