  - say: "Also, can I change the delivery address to 22 Park Lane, London, SW1A 2AA, UK?"
    narrate: "An address change request â€” routed to the capable model and guarded before submission."
outro: "One Decider call per routing decision, another per irreversible action, and Amazon Bedrock for the conversation â€” cost-efficient and safe by design."
